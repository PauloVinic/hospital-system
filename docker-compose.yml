version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres_agendamento
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: agendadb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_agendamento
    ports:
      - "5672:5672"     # Porta padrão AMQP
      - "15672:15672"   # UI do RabbitMQ
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  postgres_data:
