server:
  port: 8083

spring:
  graphql:
    path: /graphql
    schema:
      locations: classpath:/

  datasource:
    url: jdbc:postgresql://localhost:5432/agendadb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  security:
    user:
      name: ignore
      password: ignore

logging:
  level:
    org.springframework.graphql: DEBUG
    com.techchallenge: TRACE
