spring:
  graphql:
    path: /graphql
    schema:
      locations: classpath:schema.graphqls
    graphiql:
      enabled: false

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

  security:
    user:
      name: testuser
      password: testpass

logging:
  level:
    org.springframework.graphql: DEBUG
    com.techchallenge: TRACE
